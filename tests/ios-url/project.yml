name: URLRegression
options:
  bundleIdPrefix: dev.gpui.regression
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    ENABLE_DEBUG_DYLIB: NO
targets:
  URLRegression:
    type: application
    platform: iOS
    sources: [App.swift]
    info:
      path: build/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        OTHER_LDFLAGS: ['$(inherited)', '"$(REGRESSION_STATIC_LIB)"', '-lc++', '-framework UIKit', '-framework Metal', '-framework MetalKit', '-framework QuartzCore', '-framework CoreText', '-framework CoreGraphics', '-framework Foundation', '-framework Security', '-framework SystemConfiguration']
  URLTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests.swift]
    dependencies: [{target: URLRegression}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  URLRegression:
    build:
      targets:
        URLRegression: all
    test:
      targets: [URLTests]
